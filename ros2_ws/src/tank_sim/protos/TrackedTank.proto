#VRML_SIM R2025a utf8
# Гусеничная аппроксимация + Lidar D500.
# Мир ENU, робот FLU: X вперёд, Y влево, Z вверх.
# Cylinder в R2022a+ вдоль локального Z.

PROTO TrackedTank [
  field SFVec3f    translation  0 0 0.05
  field SFRotation rotation     0 0 1 0
  field SFString   name         "tracked_tank"
  field SFString   controller   "<extern>"
  field SFBool     supervisor   FALSE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    supervisor IS supervisor
    children [
      # Корпус: длина X, ширина Y, высота Z
      Shape {
        appearance PBRAppearance {
          baseColor 0.3 0.3 0.35
          roughness 0.7
          metalness 0.1
        }
        geometry Box {
          size 0.40 0.28 0.12
        }
      }
      # Левое колесо: ось шарнира Y; Cylinder (Z) → Y через +90° вокруг X
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 0.165 0
        }
        device [
          RotationalMotor {
            name "left_motor"
            maxVelocity 12
            maxTorque 5
          }
          PositionSensor {
            name "left_sensor"
          }
        ]
        endPoint Solid {
          translation 0 0.165 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 1 }
              geometry Cylinder { height 0.05 radius 0.05 }
            }
          ]
          name "left_wheel"
          boundingObject Cylinder { height 0.05 radius 0.05 }
          physics Physics { density 400 }
        }
      }
      # Правое колесо
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 -0.165 0
        }
        device [
          RotationalMotor {
            name "right_motor"
            maxVelocity 12
            maxTorque 5
          }
          PositionSensor {
            name "right_sensor"
          }
        ]
        endPoint Solid {
          translation 0 -0.165 0
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.05 0.05 0.05 roughness 1 }
              geometry Cylinder { height 0.05 radius 0.05 }
            }
          ]
          name "right_wheel"
          boundingObject Cylinder { height 0.05 radius 0.05 }
          physics Physics { density 400 }
        }
      }
      # Лидар: вращение головы вокруг локального Y → Y должен смотреть вверх (Z мира)
      Lidar {
        translation 0.05 0 0.10
        rotation 1 0 0 -1.5708
        name "D500"
        fieldOfView 1.5708
        horizontalResolution 512
        numberOfLayers 1
        near 0.03
        minRange 0.03
        maxRange 12.0
        type "rotating"
        defaultFrequency 10
        minFrequency 5
        maxFrequency 15
        rotatingHead Solid {
          # Визуал башни: Cylinder (Z) совместить с осью спина (Y)
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 1 0.5 0 roughness 0.6 }
              geometry Cylinder { height 0.04 radius 0.025 }
            }
          ]
          name "d500_head"
          boundingObject Cylinder { height 0.04 radius 0.025 }
        }
      }
    ]
    boundingObject Box { size 0.40 0.28 0.12 }
    physics Physics {
      density -1
      mass 10
    }
  }
}
